<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="shortcut icon" href="https://imran.link/favicon.ico" />
    <title>Lectures · MSc in CSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <style>
        body { background-color: #f5f7fa; }
        .subject-header { cursor: pointer; }
        .file-icon.pdf { color: #dc3545; }
        .file-icon.pptx { color: #d24726; }
        .file-icon.doc, .file-icon.docx { color: #2b579a; }
        .list-group-item:hover { background-color: #f0f4ff; }
        .subject-code-badge { font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container py-4 py-md-5">
        <div class="text-center mb-4 mb-md-5">
            <h1 class="fw-bold">MSc in CSE</h1>
            <p class="text-muted">Lecture Slides &amp; Materials - 1st Semester</p>
        </div>
        <div class="mb-4">
            <input type="text" id="searchBox" class="form-control form-control-lg shadow-sm" placeholder="Search by subject, topic or lecture title..." />
        </div>
        <div id="subjectsContainer" class="accordion shadow-sm"></div>
        <p id="noResults" class="text-center text-muted mt-4 d-none">No lectures found.</p>
    </div>

    <script src="scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
